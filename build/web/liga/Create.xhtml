<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateLigaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateLigaLabel_id}" for="id" />
                    <h:inputText id="id" value="#{ligaController.selected.id}" title="#{bundle.CreateLigaTitle_id}" required="true" requiredMessage="#{bundle.CreateLigaRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.CreateLigaLabel_descripcion}" for="descripcion" />
                    <h:inputText id="descripcion" value="#{ligaController.selected.descripcion}" title="#{bundle.CreateLigaTitle_descripcion}" required="true" requiredMessage="#{bundle.CreateLigaRequiredMessage_descripcion}"/>
                    <h:outputLabel value="#{bundle.CreateLigaLabel_cantidadEquipo}" for="cantidadEquipo" />
                    <h:inputText id="cantidadEquipo" value="#{ligaController.selected.cantidadEquipo}" title="#{bundle.CreateLigaTitle_cantidadEquipo}" required="true" requiredMessage="#{bundle.CreateLigaRequiredMessage_cantidadEquipo}"/>
                    <h:outputLabel value="#{bundle.CreateLigaLabel_idJuego}" for="idJuego" />
                    <h:selectOneMenu id="idJuego" value="#{ligaController.selected.idJuego}" title="#{bundle.CreateLigaTitle_idJuego}" required="true" requiredMessage="#{bundle.CreateLigaRequiredMessage_idJuego}">
                        <f:selectItems value="#{videoJuegoController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{ligaController.create}" value="#{bundle.CreateLigaSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{ligaController.prepareList}" value="#{bundle.CreateLigaShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateLigaIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>

<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditFaseTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditFaseLabel_id}" for="id" />
                    <h:inputText id="id" value="#{faseController.selected.id}" title="#{bundle.EditFaseTitle_id}" required="true" requiredMessage="#{bundle.EditFaseRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditFaseLabel_descripcion}" for="descripcion" />
                    <h:inputText id="descripcion" value="#{faseController.selected.descripcion}" title="#{bundle.EditFaseTitle_descripcion}" required="true" requiredMessage="#{bundle.EditFaseRequiredMessage_descripcion}"/>
                </h:panelGrid>
                <h:commandLink action="#{faseController.update}" value="#{bundle.EditFaseSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditFaseViewLink}"/>
                <br />
                <h:commandLink action="#{faseController.prepareList}" value="#{bundle.EditFaseShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditFaseIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>

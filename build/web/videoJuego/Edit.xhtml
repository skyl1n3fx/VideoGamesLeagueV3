<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditVideoJuegoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditVideoJuegoLabel_id}" for="id" />
                    <h:inputText id="id" value="#{videoJuegoController.selected.id}" title="#{bundle.EditVideoJuegoTitle_id}" required="true" requiredMessage="#{bundle.EditVideoJuegoRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditVideoJuegoLabel_nombre}" for="nombre" />
                    <h:inputText id="nombre" value="#{videoJuegoController.selected.nombre}" title="#{bundle.EditVideoJuegoTitle_nombre}" required="true" requiredMessage="#{bundle.EditVideoJuegoRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.EditVideoJuegoLabel_tipoJuego}" for="tipoJuego" />
                    <h:inputText id="tipoJuego" value="#{videoJuegoController.selected.tipoJuego}" title="#{bundle.EditVideoJuegoTitle_tipoJuego}" required="true" requiredMessage="#{bundle.EditVideoJuegoRequiredMessage_tipoJuego}"/>
                </h:panelGrid>
                <h:commandLink action="#{videoJuegoController.update}" value="#{bundle.EditVideoJuegoSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditVideoJuegoViewLink}"/>
                <br />
                <h:commandLink action="#{videoJuegoController.prepareList}" value="#{bundle.EditVideoJuegoShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditVideoJuegoIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>

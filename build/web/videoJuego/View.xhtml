<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewVideoJuegoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewVideoJuegoLabel_id}"/>
                    <h:outputText value="#{videoJuegoController.selected.id}" title="#{bundle.ViewVideoJuegoTitle_id}"/>
                    <h:outputText value="#{bundle.ViewVideoJuegoLabel_nombre}"/>
                    <h:outputText value="#{videoJuegoController.selected.nombre}" title="#{bundle.ViewVideoJuegoTitle_nombre}"/>
                    <h:outputText value="#{bundle.ViewVideoJuegoLabel_tipoJuego}"/>
                    <h:outputText value="#{videoJuegoController.selected.tipoJuego}" title="#{bundle.ViewVideoJuegoTitle_tipoJuego}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{videoJuegoController.destroyAndView}" value="#{bundle.ViewVideoJuegoDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewVideoJuegoEditLink}"/>
                <br />
                <h:commandLink action="#{videoJuegoController.prepareCreate}" value="#{bundle.ViewVideoJuegoCreateLink}" />
                <br />
                <h:commandLink action="#{videoJuegoController.prepareList}" value="#{bundle.ViewVideoJuegoShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewVideoJuegoIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>

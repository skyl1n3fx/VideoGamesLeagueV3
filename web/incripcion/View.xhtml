<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewIncripcionTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewIncripcionLabel_id}"/>
                    <h:outputText value="#{incripcionController.selected.id}" title="#{bundle.ViewIncripcionTitle_id}"/>
                    <h:outputText value="#{bundle.ViewIncripcionLabel_fecha}"/>
                    <h:outputText value="#{incripcionController.selected.fecha}" title="#{bundle.ViewIncripcionTitle_fecha}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewIncripcionLabel_idJugador}"/>
                    <h:outputText value="#{incripcionController.selected.idJugador}" title="#{bundle.ViewIncripcionTitle_idJugador}"/>
                    <h:outputText value="#{bundle.ViewIncripcionLabel_idEstado}"/>
                    <h:outputText value="#{incripcionController.selected.idEstado}" title="#{bundle.ViewIncripcionTitle_idEstado}"/>
                    <h:outputText value="#{bundle.ViewIncripcionLabel_idEquipo}"/>
                    <h:outputText value="#{incripcionController.selected.idEquipo}" title="#{bundle.ViewIncripcionTitle_idEquipo}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{incripcionController.destroyAndView}" value="#{bundle.ViewIncripcionDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewIncripcionEditLink}"/>
                <br />
                <h:commandLink action="#{incripcionController.prepareCreate}" value="#{bundle.ViewIncripcionCreateLink}" />
                <br />
                <h:commandLink action="#{incripcionController.prepareList}" value="#{bundle.ViewIncripcionShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewIncripcionIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>

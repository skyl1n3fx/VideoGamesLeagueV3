<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListIncripcionTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListIncripcionEmpty}" rendered="#{incripcionController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{incripcionController.items.rowCount > 0}">
                    <h:outputText value="#{incripcionController.pagination.pageFirstItem + 1}..#{incripcionController.pagination.pageLastItem + 1}/#{incripcionController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{incripcionController.previous}" value="#{bundle.Previous} #{incripcionController.pagination.pageSize}" rendered="#{incripcionController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{incripcionController.next}" value="#{bundle.Next} #{incripcionController.pagination.pageSize}" rendered="#{incripcionController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{incripcionController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListIncripcionTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListIncripcionTitle_fecha}"/>
                            </f:facet>
                            <h:outputText value="#{item.fecha}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListIncripcionTitle_idJugador}"/>
                            </f:facet>
                            <h:outputText value="#{item.idJugador}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListIncripcionTitle_idEstado}"/>
                            </f:facet>
                            <h:outputText value="#{item.idEstado}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListIncripcionTitle_idEquipo}"/>
                            </f:facet>
                            <h:outputText value="#{item.idEquipo}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{incripcionController.prepareView}" value="#{bundle.ListIncripcionViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{incripcionController.prepareEdit}" value="#{bundle.ListIncripcionEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{incripcionController.destroy}" value="#{bundle.ListIncripcionDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{incripcionController.prepareCreate}" value="#{bundle.ListIncripcionCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListIncripcionIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>

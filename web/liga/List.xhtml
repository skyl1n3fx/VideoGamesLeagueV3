<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListLigaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListLigaEmpty}" rendered="#{ligaController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{ligaController.items.rowCount > 0}">
                    <h:outputText value="#{ligaController.pagination.pageFirstItem + 1}..#{ligaController.pagination.pageLastItem + 1}/#{ligaController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{ligaController.previous}" value="#{bundle.Previous} #{ligaController.pagination.pageSize}" rendered="#{ligaController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{ligaController.next}" value="#{bundle.Next} #{ligaController.pagination.pageSize}" rendered="#{ligaController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{ligaController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLigaTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLigaTitle_descripcion}"/>
                            </f:facet>
                            <h:outputText value="#{item.descripcion}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLigaTitle_cantidadEquipo}"/>
                            </f:facet>
                            <h:outputText value="#{item.cantidadEquipo}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLigaTitle_idJuego}"/>
                            </f:facet>
                            <h:outputText value="#{item.idJuego}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{ligaController.prepareView}" value="#{bundle.ListLigaViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{ligaController.prepareEdit}" value="#{bundle.ListLigaEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{ligaController.destroy}" value="#{bundle.ListLigaDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{ligaController.prepareCreate}" value="#{bundle.ListLigaCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListLigaIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>

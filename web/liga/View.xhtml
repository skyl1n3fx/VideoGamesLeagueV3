<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewLigaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewLigaLabel_id}"/>
                    <h:outputText value="#{ligaController.selected.id}" title="#{bundle.ViewLigaTitle_id}"/>
                    <h:outputText value="#{bundle.ViewLigaLabel_descripcion}"/>
                    <h:outputText value="#{ligaController.selected.descripcion}" title="#{bundle.ViewLigaTitle_descripcion}"/>
                    <h:outputText value="#{bundle.ViewLigaLabel_cantidadEquipo}"/>
                    <h:outputText value="#{ligaController.selected.cantidadEquipo}" title="#{bundle.ViewLigaTitle_cantidadEquipo}"/>
                    <h:outputText value="#{bundle.ViewLigaLabel_idJuego}"/>
                    <h:outputText value="#{ligaController.selected.idJuego}" title="#{bundle.ViewLigaTitle_idJuego}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{ligaController.destroyAndView}" value="#{bundle.ViewLigaDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewLigaEditLink}"/>
                <br />
                <h:commandLink action="#{ligaController.prepareCreate}" value="#{bundle.ViewLigaCreateLink}" />
                <br />
                <h:commandLink action="#{ligaController.prepareList}" value="#{bundle.ViewLigaShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewLigaIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>

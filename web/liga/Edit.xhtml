<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditLigaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditLigaLabel_id}" for="id" />
                    <h:inputText id="id" value="#{ligaController.selected.id}" title="#{bundle.EditLigaTitle_id}" required="true" requiredMessage="#{bundle.EditLigaRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditLigaLabel_descripcion}" for="descripcion" />
                    <h:inputText id="descripcion" value="#{ligaController.selected.descripcion}" title="#{bundle.EditLigaTitle_descripcion}" required="true" requiredMessage="#{bundle.EditLigaRequiredMessage_descripcion}"/>
                    <h:outputLabel value="#{bundle.EditLigaLabel_cantidadEquipo}" for="cantidadEquipo" />
                    <h:inputText id="cantidadEquipo" value="#{ligaController.selected.cantidadEquipo}" title="#{bundle.EditLigaTitle_cantidadEquipo}" required="true" requiredMessage="#{bundle.EditLigaRequiredMessage_cantidadEquipo}"/>
                    <h:outputLabel value="#{bundle.EditLigaLabel_idJuego}" for="idJuego" />
                    <h:selectOneMenu id="idJuego" value="#{ligaController.selected.idJuego}" title="#{bundle.EditLigaTitle_idJuego}" required="true" requiredMessage="#{bundle.EditLigaRequiredMessage_idJuego}">
                        <f:selectItems value="#{videoJuegoController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{ligaController.update}" value="#{bundle.EditLigaSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditLigaViewLink}"/>
                <br />
                <h:commandLink action="#{ligaController.prepareList}" value="#{bundle.EditLigaShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditLigaIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>

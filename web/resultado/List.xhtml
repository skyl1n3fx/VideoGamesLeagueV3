<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListResultadoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListResultadoEmpty}" rendered="#{resultadoController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{resultadoController.items.rowCount > 0}">
                    <h:outputText value="#{resultadoController.pagination.pageFirstItem + 1}..#{resultadoController.pagination.pageLastItem + 1}/#{resultadoController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{resultadoController.previous}" value="#{bundle.Previous} #{resultadoController.pagination.pageSize}" rendered="#{resultadoController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{resultadoController.next}" value="#{bundle.Next} #{resultadoController.pagination.pageSize}" rendered="#{resultadoController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{resultadoController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListResultadoTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListResultadoTitle_descripcion}"/>
                            </f:facet>
                            <h:outputText value="#{item.descripcion}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{resultadoController.prepareView}" value="#{bundle.ListResultadoViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{resultadoController.prepareEdit}" value="#{bundle.ListResultadoEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{resultadoController.destroy}" value="#{bundle.ListResultadoDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{resultadoController.prepareCreate}" value="#{bundle.ListResultadoCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListResultadoIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>

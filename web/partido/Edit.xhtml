<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditPartidoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditPartidoLabel_id}" for="id" />
                    <h:inputText id="id" value="#{partidoController.selected.id}" title="#{bundle.EditPartidoTitle_id}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditPartidoLabel_fecha}" for="fecha" />
                    <h:inputText id="fecha" value="#{partidoController.selected.fecha}" title="#{bundle.EditPartidoTitle_fecha}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_fecha}"/>
                    <h:outputLabel value="#{bundle.EditPartidoLabel_horaInicio}" for="horaInicio" />
                    <h:inputText id="horaInicio" value="#{partidoController.selected.horaInicio}" title="#{bundle.EditPartidoTitle_horaInicio}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_horaInicio}"/>
                    <h:outputLabel value="#{bundle.EditPartidoLabel_horaTermino}" for="horaTermino" />
                    <h:inputText id="horaTermino" value="#{partidoController.selected.horaTermino}" title="#{bundle.EditPartidoTitle_horaTermino}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_horaTermino}"/>
                    <h:outputLabel value="#{bundle.EditPartidoLabel_idFase}" for="idFase" />
                    <h:selectOneMenu id="idFase" value="#{partidoController.selected.idFase}" title="#{bundle.EditPartidoTitle_idFase}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_idFase}">
                        <f:selectItems value="#{faseController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditPartidoLabel_idLiga}" for="idLiga" />
                    <h:selectOneMenu id="idLiga" value="#{partidoController.selected.idLiga}" title="#{bundle.EditPartidoTitle_idLiga}" required="true" requiredMessage="#{bundle.EditPartidoRequiredMessage_idLiga}">
                        <f:selectItems value="#{ligaController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{partidoController.update}" value="#{bundle.EditPartidoSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditPartidoViewLink}"/>
                <br />
                <h:commandLink action="#{partidoController.prepareList}" value="#{bundle.EditPartidoShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditPartidoIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>

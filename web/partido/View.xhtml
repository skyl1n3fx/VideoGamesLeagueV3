<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewPartidoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewPartidoLabel_id}"/>
                    <h:outputText value="#{partidoController.selected.id}" title="#{bundle.ViewPartidoTitle_id}"/>
                    <h:outputText value="#{bundle.ViewPartidoLabel_fecha}"/>
                    <h:outputText value="#{partidoController.selected.fecha}" title="#{bundle.ViewPartidoTitle_fecha}"/>
                    <h:outputText value="#{bundle.ViewPartidoLabel_horaInicio}"/>
                    <h:outputText value="#{partidoController.selected.horaInicio}" title="#{bundle.ViewPartidoTitle_horaInicio}"/>
                    <h:outputText value="#{bundle.ViewPartidoLabel_horaTermino}"/>
                    <h:outputText value="#{partidoController.selected.horaTermino}" title="#{bundle.ViewPartidoTitle_horaTermino}"/>
                    <h:outputText value="#{bundle.ViewPartidoLabel_idFase}"/>
                    <h:outputText value="#{partidoController.selected.idFase}" title="#{bundle.ViewPartidoTitle_idFase}"/>
                    <h:outputText value="#{bundle.ViewPartidoLabel_idLiga}"/>
                    <h:outputText value="#{partidoController.selected.idLiga}" title="#{bundle.ViewPartidoTitle_idLiga}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{partidoController.destroyAndView}" value="#{bundle.ViewPartidoDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewPartidoEditLink}"/>
                <br />
                <h:commandLink action="#{partidoController.prepareCreate}" value="#{bundle.ViewPartidoCreateLink}" />
                <br />
                <h:commandLink action="#{partidoController.prepareList}" value="#{bundle.ViewPartidoShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewPartidoIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>

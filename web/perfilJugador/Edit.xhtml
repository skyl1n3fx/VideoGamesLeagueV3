<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">

                    <h:inputText id="nombre" value="#{perfilJugadorController.selected.nombre}" title="#{bundle.EditPerfilJugadorTitle_nombre}" required="true" requiredMessage="#{bundle.EditPerfilJugadorRequiredMessage_nombre}"/>
                    <h:outputLabel value="#{bundle.EditPerfilJugadorLabel_apellido}" for="apellido" />

                <h:commandLink action="#{perfilJugadorController.prepareList}" value="#{bundle.EditPerfilJugadorShowAllLink}" immediate="true"/>

                <br />

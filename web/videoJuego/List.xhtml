<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListVideoJuegoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListVideoJuegoEmpty}" rendered="#{videoJuegoController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{videoJuegoController.items.rowCount > 0}">
                    <h:outputText value="#{videoJuegoController.pagination.pageFirstItem + 1}..#{videoJuegoController.pagination.pageLastItem + 1}/#{videoJuegoController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{videoJuegoController.previous}" value="#{bundle.Previous} #{videoJuegoController.pagination.pageSize}" rendered="#{videoJuegoController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{videoJuegoController.next}" value="#{bundle.Next} #{videoJuegoController.pagination.pageSize}" rendered="#{videoJuegoController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{videoJuegoController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVideoJuegoTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVideoJuegoTitle_nombre}"/>
                            </f:facet>
                            <h:outputText value="#{item.nombre}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVideoJuegoTitle_tipoJuego}"/>
                            </f:facet>
                            <h:outputText value="#{item.tipoJuego}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{videoJuegoController.prepareView}" value="#{bundle.ListVideoJuegoViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{videoJuegoController.prepareEdit}" value="#{bundle.ListVideoJuegoEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{videoJuegoController.destroy}" value="#{bundle.ListVideoJuegoDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{videoJuegoController.prepareCreate}" value="#{bundle.ListVideoJuegoCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListVideoJuegoIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
